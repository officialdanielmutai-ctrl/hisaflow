model_list:
  # ----------------------------------------------------------------------
  # PRIMARY POOL — Round-robin across the verified standard providers.
  # LiteLLM will cycle through these for every standard request.
  # On 429 or 5xx it cascades immediately to the next entry.
  # ONLY model IDs verified by `apps/backend/scripts/tool-calling-spike.mjs`
  # may be enabled here; unverified/broken IDs are kept commented with the
  # date and reason so drift is visible (regression guard: Q-005).
  # ----------------------------------------------------------------------

  # Tier 1 — Groq (fastest inference; gpt-oss-120b verified 2026-10-11)
  - model_name: hisaflow-standard
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  # Tier 2 — Cerebras (dedicated silicon). DISABLED 2026-10-11: returned
  # 402 (billing not provisioned). Re-enable only after the spike passes.
  # - model_name: hisaflow-standard
  #   litellm_params:
  #     model: cerebras/gpt-oss-120b
  #     api_key: os.environ/CEREBRAS_API_KEY

  # Tier 3 — OpenRouter → DeepSeek (ultra low-cost; verified 2026-10-11)
  - model_name: hisaflow-standard
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY

  # Tier 4 — Mistral Large. DISABLED 2026-10-11: `mistral-large-latest`
  # returned 403 (not authorised on the current key). Re-enable only after
  # the spike passes for an authorised model ID.
  # - model_name: hisaflow-standard
  #   litellm_params:
  #     model: mistral/mistral-large-latest
  #     api_key: os.environ/MISTRAL_API_KEY

  # Tier 5 — Google Gemini (verified 2026-10-11)
  - model_name: hisaflow-standard
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ----------------------------------------------------------------------
  # Premium / Bedrock failsafe — DISABLED 2026-10-11 (Q-005):
  # `apps/gateway/.env` has no AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, so
  # this deployment could never be reached. The standard pool now has three
  # verified providers, so the standard→premium fallback was removed. Re-add
  # both this block and the `hisaflow-standard` entry in `fallbacks` once AWS
  # credentials are provisioned and the spike passes.
  #
  # - model_name: hisaflow-premium
  #   litellm_params:
  #     model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
  #     aws_region_name: us-east-1
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  # ----------------------------------------------------------------------

  # ----------------------------------------------------------------------
  # ASSISTANT POOL — tool-calling only. ORDERED, NOT SHUFFLED.
  # Each group below has exactly ONE deployment, so `simple-shuffle` has
  # nothing to shuffle; the `fallbacks` chain gives deterministic, ordered
  # failover. A conversation therefore stays on the same model until that
  # model actually fails. Only models that PASSED the tool-calling spike
  # (`apps/backend/scripts/tool-calling-spike.mjs`, English + Swahili) may be
  # added here. Tool-calling and Swahili quality differ per provider, so the
  # order is deliberate until the live eval set says otherwise.
  # ----------------------------------------------------------------------
  - model_name: hisaflow-assistant
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: hisaflow-assistant-fallback-1
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: hisaflow-assistant-fallback-2
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ----------------------------------------------------------------------
  # VISION POOL — OCR only (receipt/label images). Same model-gateway path
  # as every other AI call so the admin provider switch, gateway logging and
  # (future) LiteLLM budgets cover OCR. Ordered, not shuffled.
  # ----------------------------------------------------------------------
  - model_name: hisaflow-vision
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: hisaflow-vision-fallback-1
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

# ----------------------------------------------------------------------
# ROUTER SETTINGS
# simple-shuffle distributes load across the primary pool.
# On allowed_fails consecutive errors the provider is marked unhealthy
# and skipped until it recovers (cooldown_time seconds).
# ----------------------------------------------------------------------
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 0
  allowed_fails: 2
  cooldown_time: 60

# ----------------------------------------------------------------------
# FALLBACK CHAIN
# The standard pool is a shuffle of verified providers, so it does not
# reference the (disabled) Bedrock premium deployment. The assistant and
# vision groups keep their ordered, non-shuffled fallbacks.
# ----------------------------------------------------------------------
fallbacks:
  - hisaflow-assistant:
      - hisaflow-assistant-fallback-1
  - hisaflow-assistant-fallback-1:
      - hisaflow-assistant-fallback-2
  - hisaflow-vision:
      - hisaflow-vision-fallback-1

# ----------------------------------------------------------------------
# LITELLM GLOBAL SETTINGS
# ----------------------------------------------------------------------
litellm_settings:
  request_timeout: 30
  drop_params: true       # Ignore unsupported params per-provider silently
  telemetry: false        # Disable LiteLLM's own telemetry

# ----------------------------------------------------------------------
# GENERAL / SECURITY
# master_key gates all requests to the proxy
# ----------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false   # Set true once a dedicated DB is wired up
