name: Gateway image

on:
  push:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - '.github/workflows/gateway-image.yml'
  workflow_dispatch:

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # GHCR image path used by Northflank:
  # ghcr.io/officialdanielmutai-ctrl/hisaflow-gateway:latest
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hisaflow-gateway

jobs:
  publish:
    name: Build and publish LiteLLM gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # apps/gateway/Dockerfile copies config.yaml from the build context,
          # so the context must be the gateway directory, not the repo root.
          context: apps/gateway
          file: apps/gateway/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
