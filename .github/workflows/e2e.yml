name: E2E (browser smoke tests)

# Playwright needs a seeded, deployed environment and browser binaries, which
# makes it too slow/stateful for every PR. Run it nightly and on demand.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Seeded environment base URL
        required: true
  schedule:
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke tests
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || secrets.E2E_BASE_URL }}
          E2E_STORAGE_STATE: ${{ secrets.E2E_STORAGE_STATE_PATH }}
          E2E_STAFF_STORAGE_STATE: ${{ secrets.E2E_STAFF_STORAGE_STATE_PATH }}
          E2E_ORG_NAME: ${{ secrets.E2E_ORG_NAME }}
          E2E_BOOKING_ID: ${{ secrets.E2E_BOOKING_ID }}
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
